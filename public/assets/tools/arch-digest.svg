<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="arch-digest command line example">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#151b33"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(250 80% 62%)"/><stop offset="1" stop-color="hsl(300 75% 55%)"/></linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="820" cy="80" r="170" fill="hsl(250 80% 62%)" opacity="0.10"/>
  <circle cx="900" cy="470" r="120" fill="hsl(300 75% 55%)" opacity="0.10"/>
  <rect x="28" y="28" width="904" height="484" rx="20" fill="#0f172a" stroke="#334155"/>
