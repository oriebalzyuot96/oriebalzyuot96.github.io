  <text x="480" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94a3b8">arch-digest</text>
  <rect x="48" y="104" width="6" height="40" rx="3" fill="url(#ac)"/>
  <text x="68" y="132" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#f8fafc"><tspan fill="hsl(250 80% 62%)">$</tspan> arch-digest . --out docs/architecture --since main</text>
  <text xml:space="preserve" x="64" y="232" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#6ee7b7">✔ indexed 27 files (17 code) in 5 modules</text>
  <text xml:space="preserve" x="64" y="278" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#6ee7b7">✔ stack: Node.js, Go 1.22, .NET (net8.0), Express, NestJS, ASP.NET Core, gorilla/mux</text>
  <text xml:space="preserve" x="64" y="324" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#6ee7b7">✔ 22 routes, 2 internal edges, 6 data models</text>
