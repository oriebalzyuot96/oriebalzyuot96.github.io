<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}html,body{width:640px;height:640px;overflow:hidden}
.bg{position:absolute;inset:0;background:
 radial-gradient(42% 38% at 50% 30%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
 radial-gradient(40% 40% at 88% 14%,rgba(255,190,222,.55),transparent 70%),
 radial-gradient(50% 50% at 8% 88%,rgba(141,115,255,.5),transparent 70%),
 linear-gradient(180deg,#f7f3ff 0%,#e6ddff 55%,#c7b5fb 100%)}
.bokeh{position:absolute;border-radius:50%;background:#fff;filter:blur(10px)}
.ring{position:absolute;left:50%;top:31%;width:420px;height:420px;translate:-50% -50%;border-radius:50%;border:2px solid rgba(124,92,255,.18);box-shadow:0 0 0 22px rgba(124,92,255,.05)}
img{position:absolute;inset:0;width:640px;height:640px;filter:drop-shadow(0 18px 30px rgba(70,40,150,.28))}
