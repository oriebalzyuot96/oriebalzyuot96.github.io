<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- LinkedIn Featured thumbnails, 1200×627 (1.91:1). Variant via ?v=cv|site|video -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:627px;overflow:hidden;font-family:Pretendard,system-ui,sans-serif;color:#1f1b2e}
body{position:relative;background:
 radial-gradient(520px 420px at 88% 8%,rgba(255,190,222,.65),transparent 70%),
 radial-gradient(560px 460px at 6% 100%,rgba(141,115,255,.45),transparent 70%),
 linear-gradient(135deg,#f8f5ff,#e6ddff 60%,#d3c4fc)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(109,74,255,.18) 1.2px,transparent 1.8px);background-size:30px 30px;mask-image:linear-gradient(90deg,#000,transparent 60%)}
.photo{position:absolute;right:56px;bottom:0;width:430px;height:560px;border-radius:36px 36px 0 0;overflow:hidden;box-shadow:0 30px 70px -20px rgba(70,40,150,.55);border:6px solid #fff;border-bottom:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.badge{position:absolute;right:30px;top:62px;background:#fff;border-radius:20px;padding:14px 20px;box-shadow:0 16px 40px -14px rgba(70,40,150,.5);font-weight:800;font-size:22px;display:flex;gap:10px;align-items:center}
.badge i{width:12px;height:12px;border-radius:50%;background:#0b7a5c;box-shadow:0 0 0 6px rgba(11,122,92,.16)}
.logo{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px}
.logo span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:19px;background:linear-gradient(135deg,#6d4aff,#b9a7ff)}
.logo b{color:#6d4aff}
.main{position:absolute;left:64px;top:150px;width:610px}
.kicker{font:700 20px "JetBrains Mono",monospace;letter-spacing:.14em;color:#6d4aff;text-transform:uppercase}
h1{font-size:76px;line-height:1.02;letter-spacing:-.045em;font-weight:800;margin:16px 0 14px}
h1 em{font-style:normal;color:#6d4aff}
.ar{font-family:"IBM Plex Sans Arabic",sans-serif;direction:rtl;text-align:left;font-size:28px;font-weight:700;color:#55506d;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;width:620px}
.chips span{font-weight:700;font-size:18px;padding:8px 15px;border-radius:999px;background:#fff;border:1.5px solid #d9d0f5;color:#4a4562}
.chips span.hot{background:linear-gradient(135deg,#6d4aff,#9d86ff);color:#fff;border-color:transparent}
.url{position:absolute;left:64px;bottom:44px;font:700 24px "JetBrains Mono",monospace;color:#4a4562;background:#fff;padding:12px 22px;border-radius:999px;box-shadow:0 10px 30px -12px rgba(70,40,150,.4)}
.play{position:absolute;right:238px;bottom:230px;width:118px;height:118px;border-radius:50%;background:#fff;display:none;place-items:center;box-shadow:0 20px 50px rgba(70,40,150,.55);z-index:3}
.play svg{width:52px;height:52px;margin-left:8px;color:#6d4aff}
.v-site .play,.v-cv .play{display:none}.v-video .play{display:grid}
.pdf{position:absolute;left:64px;bottom:44px;display:none}
.v-cv .pdf{display:flex;gap:12px;align-items:center}
.v-cv .url{left:auto;left:290px}
.pdf b{font:800 22px "JetBrains Mono",monospace;background:#e5484d;color:#fff;border-radius:12px;padding:12px 18px}
</style></head>
<body>
<div class="dots"></div>
<div class="logo"><span>OG</span>Orieb<b>.dev</b></div>
<div class="photo"><img src="../../public/assets/orieb.jpg" alt=""></div>
<div class="badge" id="badge"><i></i><span id="badgeT"></span></div>
<div class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></div>
<div class="main">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="ar" id="ar"></div>
  <div class="chips" id="chips"></div>
</div>
<div class="pdf"><b>PDF</b></div>
<div class="url" id="url"></div>
<script>
const V={
 cv:{k:'Curriculum Vitae · 2026',t:'Senior <em>Front-End</em> Engineer',ar:'عريب الزيوت · السيرة الذاتية',chips:[['Angular',1],['React',0],['React Native',0],['Astro',0],['.NET · Node',0]],badge:'Open to work',url:'Orieb-Alzyuot-CV.pdf'},
 site:{k:'Portfolio · EN / العربية',t:'I build interfaces people <em>trust</em>',ar:'عريب الزيوت · Senior Front-End',chips:[['Saudi gov & fintech',1],['6+ years',0],['Case studies',0],['Hire me',0]],badge:'Freelance · Remote',url:'oriebalzyuot96.github.io'},
 video:{k:'Intro · 40 seconds',t:'My story in <em>40 seconds</em>',ar:'عريب الزيوت · فيديو تعريفي',chips:[['Who I am',0],['Platforms shipped',0],['How I work',1]],badge:'With captions',url:'oriebalzyuot96.github.io/#intro'}
};
const v=new URLSearchParams(location.search).get('v')||'cv', d=V[v];
document.body.className='v-'+v;
kicker.textContent=d.k;title.innerHTML=d.t;ar.textContent=d.ar;badgeT.textContent=d.badge;url.textContent=d.url;
chips.innerHTML=d.chips.map(([c,h])=>`<span class="${h?'hot':''}">${c}</span>`).join('');
</script>
</body></html>
